name: Playwright BDD CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run BDD Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-bdd-framework
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run BDD tests
        run: npx cucumber-js

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            playwright-bdd-framework/reports/
            playwright-bdd-framework/test-results/
          if-no-files-found: ignore